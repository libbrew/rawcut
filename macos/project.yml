name: Rawcut
options:
  bundleIdPrefix: app.rawcut
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Rawcut:
    type: application
    platform: macOS
    sources:
      - path: Rawcut
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rawcut.mac
        PRODUCT_NAME: Rawcut
        INFOPLIST_FILE: Rawcut/Info.plist
        CODE_SIGN_ENTITLEMENTS: Rawcut/Rawcut.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ARCHS: "$(NATIVE_ARCH_ACTUAL)"
    postBuildScripts:
      - name: Bundle Rawcut engine
        script: '"$SRCROOT/scripts/bundle-engine.sh"'
        basedOnDependencyAnalysis: false
schemes:
  Rawcut:
    build:
      targets:
        Rawcut: all
    run:
      config: Debug
    archive:
      config: Release
